name: Docker build and push Staging

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/docker-apply-staging.yml"
      - ".github/workflows/docker-deploy.yml"
      - ".github/workflows/docker-sbom-staging.yml"

env: 
  AWS_REGION: ca-central-1
  REGISTRY: ${{ vars.STAGING_AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com/superset
  GITHUB_SHA: ${{ github.sha }}

permissions: {}
  
jobs:
  docker-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
        DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
        DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
        DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
        DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
        DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_CL
        DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
        DNS_PROXY_WILDCARDGREEDY: "true"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: configure aws credentials using OIDC
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/cds-superset-docker-push
        role-session-name: PushContainer
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7 
  
    - name: Build container
      working-directory: ./
      run: |
        docker build \
        --file ./docker/Dockerfile \
        --tag $REGISTRY:sha-$GITHUB_SHA \
        --tag $REGISTRY:latest ./docker \
        --platform linux/arm64

    - name: Push Container to Amazon ECR
      run: |
        docker push $REGISTRY:sha-$GITHUB_SHA
        docker push $REGISTRY:latest

  docker-deploy:
    needs: docker-push
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/docker-deploy.yml
    with:
      aws_account_id: ${{ vars.STAGING_AWS_ACCOUNT_ID }}
      image_tag: sha-${{ github.sha }}
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}
      SUPERSET_PRIVATE_SUBNET_IDS: ${{ secrets.STAGING_SUPERSET_PRIVATE_SUBNET_IDS }}
      SUPERSET_ECS_TASK_SECURITY_GROUP_ID: ${{ secrets.STAGING_SUPERSET_ECS_TASK_SECURITY_GROUP_ID }}

  docker-sbom:
    needs: docker-push
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/docker-sbom-staging.yml
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

  workflow-failure:
    needs: [docker-push, docker-deploy]
    if: failure()
    permissions:
      id-token: write
    uses: ./.github/workflows/workflow-failure.yml
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}
      SLACK_WEBHOOK_URL: ${{ secrets.STAGING_CLOUDWATCH_ALERT_SLACK_WEBHOOK }}
