name: Docker deploy

on:
  workflow_call:
    inputs:
      aws_account_id:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      LOG_ANALYTICS_WORKSPACE_ID:
        required: true
      LOG_ANALYTICS_WORKSPACE_KEY:
        required: true
      SUPERSET_PRIVATE_SUBNET_IDS:
        required: true
      SUPERSET_ECS_TASK_SECURITY_GROUP_ID:
        required: true

env: 
  AWS_REGION: ca-central-1
  ECS_CLUSTER: superset
  REGISTRY: ${{ inputs.aws_account_id }}.dkr.ecr.ca-central-1.amazonaws.com/superset

permissions:
  id-token: write
  contents: read

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - superset
          - celery-worker
          - celery-beat
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@7b6ba63b4f045de61c98a3c1b99fdd08f32b0784 # v1.2.0
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}"
        DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}"
        DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
        DNS_PROXY_WILDCARDGREEDY: "true"

    - name: configure aws credentials using OIDC
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/cds-superset-docker-deploy
        role-session-name: DeployContainer
        aws-region: ${{ env.AWS_REGION }}

    - name: Update ECS task image
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
      with:
        task-definition-family: ${{ matrix.service }}
        container-name: ${{ matrix.service }}
        image: ${{ env.REGISTRY }}:${{ inputs.image_tag }}

    - name: Deploy updated ECS task
      uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ matrix.service }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        propagate-tags: SERVICE

    - name: Update SSM parameter for deployed image
      env:
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        aws ssm put-parameter \
          --name "/ecs/${{ env.ECS_CLUSTER }}/${{ matrix.service }}/container-image" \
          --value "${{ env.REGISTRY }}:${IMAGE_TAG}" \
          --type "String" \
          --overwrite

    - name: Checkout
      if: ${{ matrix.service == 'superset' }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Run Superset database upgrade
      if: ${{ matrix.service == 'superset' }}
      run: |
        .github/workflows/scripts/run-superset-upgrade.sh \
          "${{ env.ECS_CLUSTER }}" \
          "${{ secrets.SUPERSET_PRIVATE_SUBNET_IDS }}" \
          "${{ secrets.SUPERSET_ECS_TASK_SECURITY_GROUP_ID }}"
